[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantik-architect"
version = "1.0.0"
description = "Deterministic semantic-to-human multilingual communication architecture."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Semantik Architect Community License (NO-WMF) Version 1.0" }
authors = [{ name = "Semantik Architect Contributors" }]
dependencies = []

[project.optional-dependencies]
gf = ["pgf==1.1"]
dev = [
  "pytest>=8.0.0",
  "black>=24.1.0",
  "flake8>=7.0.0",
  "mypy>=1.8.0",
  "jsonschema>=4.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["semantik_architect*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[project.scripts]
semantik-architect = "semantik_architect.adapters.inbound.cli.main:main"
