version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: semantik_architect_backend
    env_file: .env
    environment:
      - FILESYSTEM_REPO_PATH=/app
      - PGF_PATH=/app/runtime/semantik_architect.pgf
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.adapters.api.main:create_app --host 0.0.0.0 --port 8000 --factory
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: semantik_architect_frontend
    env_file: .env
    environment:
      - NEXT_PUBLIC_ARCHITECT_API_BASE_URL=/semantik_architect/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: semantik_architect_nginx
    depends_on:
      - frontend
      - backend
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "4000:80"
    restart: unless-stopped
